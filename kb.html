<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Base - IT Help Desk</title><link rel="stylesheet" href="css/style.css"></head>
<body><main>
<h1>Knowledge Base</h1>
<input id="q" placeholder="Search articles (e.g. VPN, password, printer)..." style="margin-bottom:16px">
<div id="list"></div></main>
<script src="js/app.js"></script>
<script>
const ARTICLES = [
 ['Reset your password', 'Access', 'Go to the corporate password portal, choose "Forgot password", verify with MFA, then set a password of 12+ characters. If locked out, open a ticket in the Access / Password category.'],
 ['Connect to the VPN', 'Network', 'Open the VPN client, select the corporate profile, and sign in with MFA. If it keeps dropping, switch from Wi-Fi to wired, update the client, and open a ticket with the time of the last drop.'],
 ['Set up MFA', 'Access', 'Install an authenticator app, scan the QR code on the security page, and store your backup codes somewhere safe.'],
 ['Printer not working', 'Hardware', 'Check the printer is online, clear the print queue, and re-add the printer from the print server list. Include the printer name in your ticket if it persists.'],
 ['Request new software', 'Software', 'Submit a ticket in the Software category with a business justification. Licensed software requires manager approval.'],
 ['Wi-Fi keeps disconnecting', 'Network', 'Forget the network, reconnect, and update your Wi-Fi driver. Note the location and time if the issue repeats.'],
 ['Report a phishing email', 'Security', 'Do not click links or open attachments. Use the Report Phish button in your mail client, or forward the message as an attachment to security@yourcompany.example.']
];
(async () => {
  await seed(); guard('kb.html');
  const draw = q => {
    const r = ARTICLES.filter(a => (a[0] + a[1] + a[2]).toLowerCase().includes(q.toLowerCase()));
    $('#list').innerHTML = r.map(a => `<details><summary>${esc(a[0])} <span class="tag">${esc(a[1])}</span></summary><p>${esc(a[2])}</p></details>`).join('') || '<p>No matching articles. <a href="tickets.html">Open a ticket</a>.</p>';
  };
  draw(''); $('#q').oninput = e => draw(e.target.value);
})();
</script></body></html>
