<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT Help Desk - Sign in</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="login-wrap"><div class="login">
<h1>IT Help Desk</h1><p>Sign in with your company account to continue</p>
<button id="b" type="button">Sign in</button>
<div class="msg" id="m" role="alert"></div>
</div></div>
<script src="js/app.js"></script>
<script>
seed();
if (session()) location.replace('dashboard.html');
const r = new URLSearchParams(location.search).get('r'), m = $('#m');
if (r === 'expired') { m.className = 'msg err'; m.textContent = 'Please sign in to continue (session ended).'; }
$('#b').onclick = () => oktaAuthorize('id_token');
</script></body></html>
