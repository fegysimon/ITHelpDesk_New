<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile - IT Help Desk</title><link rel="stylesheet" href="css/style.css"></head>
<body><main>
<h1>Profile</h1>
<div class="card"><h2>Account</h2><p id="info"></p>
<p style="color:var(--mut);font-size:13px">Sign-in and passwords are managed by Okta. Your session ends after 15 minutes of inactivity.</p></div>
<div class="card" id="admin" style="display:none"><h2>Admin: all tickets</h2>
<table><thead><tr><th>#</th><th>Owner</th><th>Title</th><th>Status</th></tr></thead><tbody id="at"></tbody></table></div>
</main>
<script src="js/app.js"></script>
<script>
(async () => {
  await seed(); const s = guard('profile.html');
  $('#info').innerHTML = `<b>${esc(s.name)}</b><br>Username: ${esc(s.username)}<br>Role: ${esc(s.role)}`;
  if (s.role === 'admin') {
    $('#admin').style.display = 'block';
    $('#at').innerHTML = tickets().map(x => `<tr><td>${x.id}</td><td>${esc(x.owner)}</td><td>${esc(x.title)}</td><td><span class="tag ${x.status}">${x.status}</span></td></tr>`).join('');
  }
})();
</script></body></html>
